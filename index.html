<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161D" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="لونا — یک چت‌بات که دوست داره با تو حرف بزنه">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>لونا — چت‌بات</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235B6FA8' d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
<noscript>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
</noscript>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ ساختار اصلی برنامه ═══ -->
<div class="app" role="application" aria-label="چت با لونا">

    <!-- ─── هدر ─── -->
    <header class="chat-header">

        <div class="header-info">
            <div class="bot-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
            </div>
            <div class="header-text">
                <h1 class="bot-name">لونا</h1>
                <div class="bot-status" id="botStatus">آنلاین</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="clearBtn" type="button" title="پاک کردن چت"
                    aria-label="پاک کردن چت">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
            </button>

            <button class="icon-btn" id="themeBtn" type="button" title="تغییر تم"
                    aria-label="تغییر تم">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>

    </header>

    <!-- ─── منطقه پیام‌ها ─── -->
    <main class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="پیام‌ها">
        <!-- پیام‌ها توسط JavaScript رندر می‌شن -->
    </main>

    <!-- ─── نشانگر تایپ ─── -->
    <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
        <div class="msg-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        </div>
        <div class="typing-bubble">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- ─── منطقه ورودی ─── -->
    <footer class="chat-input-area">
        <div class="input-wrapper">

            <textarea
                id="chatInput"
                class="chat-input"
                placeholder="پیامی بنویس..."
                rows="1"
                autocomplete="off"
                spellcheck="false"
                enterkeyhint="send"
                aria-label="متن پیام"></textarea>

            <button id="sendBtn" class="send-btn" type="button" aria-label="ارسال پیام">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>

        </div>
        <div class="input-hint">
            <span>Enter برای ارسال، Shift+Enter برای خط جدید</span>
        </div>
    </footer>

</div>

<!-- ═══ اسکریپت‌ها ═══ -->

<!-- bot.js: موتور اصلی چت‌بات (ادغام ۷ فایل) -->
<script src="bot.js" defer></script>

<!-- اسکریپت کوچیک برای تغییر تم (feature جدا از bot) -->
<script>
(function () {
    'use strict';

    const THEME_KEY = 'luna_theme';
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');

    // بارگذاری تم قبلی
    function loadTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (saved === 'light' || saved === 'dark') {
            html.dataset.theme = saved;
            updateIcon(saved);
            return;
        }
        // اگه ذخیره نشده بود، از سیستم بگیر
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initial = prefersDark ? 'dark' : 'light';
        html.dataset.theme = initial;
        updateIcon(initial);
    }

    // تغییر تم
    function toggleTheme() {
        const current = html.dataset.theme || 'light';
        const next = current === 'light' ? 'dark' : 'light';
        html.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        updateIcon(next);
        // به‌روزرسانی theme-color
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = next === 'dark' ? '#16161D' : '#FAFAF7';
    }

    // تغییر آیکون
    function updateIcon(theme) {
        if (!themeIcon) return;
        if (theme === 'dark') {
            themeIcon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
        } else {
            themeIcon.innerHTML =
                '<circle cx="12" cy="12" r="4"/>' +
                '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
        }
    }

    // راه‌اندازی
    loadTheme();
    if (themeBtn) {
        themeBtn.addEventListener('click', toggleTheme);
    }

    // واکنش به تغییر تم سیستم
    if (window.matchMedia) {
        try {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            mq.addEventListener('change', (e) => {
                // فقط اگه کاربر تم دستی انتخاب نکرده باشه
                let saved = null;
                try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
                if (!saved) {
                    const next = e.matches ? 'dark' : 'light';
                    html.dataset.theme = next;
                    updateIcon(next);
                }
            });
        } catch (e) {}
    }
})();
</script>

</body>
</html>
